<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>milkyfarm</title>
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
  <meta name="apple-mobile-web-app-title" content="milkyfarm">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192-v2.png">
  <meta name="theme-color" content="#4C88AA">
  <style>
    :root { --main: #4C88AA; --main-d: #3d7394; --bg: #F3F7FA; --card: #fff; --line: #D3E2EB; --ink: #1F3A4A; --sub: #5A7585; --or: #E9A54E; --or-bg: #FDF6EC; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif; }
    .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
    /* 11/20 時計のあたりが白っぽくぼやける → iPhone は上のぼかしにページの地の色を使うので、地を帯と同じ青にして中身の下だけ明るい色に */
    html, body { background: var(--bg); }   /* 11/21 上は固定の青い帯（.topbar）が受け持つので、地は明るい色に戻した（下が青くならないように） */
    .wrap { background: linear-gradient(var(--main) 0, var(--main) 240px, var(--bg) 240px); }
    @media (min-width: 481px) { html, body { background: var(--bg); } }
    /* 11/20 ホーム画面から開くと上（時計・電池）に重なることがある → 最低 --sat ぶん下げる（JS が standalone のとき 50px を入れる） */
    .band { background: var(--main); color: #fff; padding: calc(22px + max(env(safe-area-inset-top, 0px), var(--sat, 0px))) 18px 46px;   /* 11/21e iOS の上の端のぼかし（帯より少し下まで）にロゴがかからないように */ }
    .band .row { display: flex; align-items: center; gap: 10px; }
    .band .logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: none; filter: none; }
    .band .logo img { width: 40px; height: 40px; }
    .band .wm { height: 24px; width: auto; display: block; }
    .band .name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .bell { margin-left: auto; position: relative; width: 46px; height: 46px; flex: none; border: 0; border-radius: 50%; background: #3f7798; display: grid; place-items: center; cursor: pointer; }   /* 11/21e 半透明をやめた */
    .bell svg { width: 22px; height: 22px; }
    .bell .n { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--or); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
    .date { margin-top: 10px; font-size: 14px; opacity: .92; }
    main { padding: 0 14px calc(30px + env(safe-area-inset-bottom, 0px)); margin-top: -32px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
    .today { box-shadow: 0 6px 18px rgba(31,58,74,.08); }
    .wx { display: flex; align-items: center; gap: 12px; }
    .wx .ic { font-size: 30px; line-height: 1; }
    .wx .t { font-size: 17px; font-weight: 700; }
    .wx .thi { margin-left: auto; text-align: right; font-size: 12px; color: var(--sub); }
    .wx .thi b { display: block; font-size: 18px; color: var(--ink); }
    .sep { height: 1px; background: var(--line); margin: 12px 0; }
    .lbl { font-size: 12px; color: var(--sub); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .duty { margin-left: auto; background: var(--or-bg); color: #9a6420; border: 1px solid #F3DDBD; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
    .prow { display: flex; gap: 10px; align-items: baseline; margin-top: 4px; }
    .pk { flex: none; width: 64px; font-size: 12px; color: var(--sub); }
    .sec .h { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sec .c { background: var(--main); color: #fff; font-size: 12px; padding: 0 8px; border-radius: 999px; line-height: 20px; }
    .sec .c:empty { display: none; }
    .lst { font-size: 15px; line-height: 1.7; }
    .lst .r { display: flex; gap: 10px; align-items: baseline; }
    .lst .no { font-weight: 800; min-width: 3.2em; }
    .lst .x { color: var(--sub); font-size: 13px; }
    .lst .bad { color: #a8452f; font-weight: 700; font-size: 13px; }
    .lst .g { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .lst .none { color: var(--sub); font-size: 14px; }
    .morning { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.65; }
    .morning a { color: var(--main); }
    .people { font-size: 15px; font-weight: 700; line-height: 1.7; }
    .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .nums4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
    .nums4 .num { border: 0; background: var(--bg); padding: 8px 6px; }
    .num .ar { font-size: 13px; font-weight: 800; margin-left: 3px; color: var(--sub); }
    .num .ar.warn { color: #a8452f; }
    .num { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
    .num .k { font-size: 11px; color: var(--sub); }
    .num .v { font-size: 22px; font-weight: 800; margin-top: 2px; }
    .num .v small { font-size: 12px; font-weight: 700; margin-left: 2px; }
    .num .s { font-size: 10px; color: var(--sub); }
    .notice { display: flex; align-items: center; gap: 10px; background: var(--or-bg); border: 1px solid #F3DDBD; border-radius: 14px; padding: 11px 14px; margin-bottom: 18px; cursor: pointer; }
    .notice svg { flex: none; width: 18px; height: 18px; }
    .notice .b { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice .t { flex: none; font-size: 11px; color: var(--sub); }
    h2 { font-size: 14px; color: var(--sub); margin: 0 4px 8px; font-weight: 700; }
    .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .appsCard { padding: 12px; } .appsCard .h2in { font-size: 14px; color: var(--sub); font-weight: 700; margin: 0 2px 8px; } .appsCard .app { background: var(--bg); border: 0; }
    .app { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-decoration: none; color: var(--ink); min-height: 58px; }
    .app:active { background: #eaf2f7; }
    .app .i { flex: none; width: 36px; height: 36px; border-radius: 10px; background: #EEF5F9; display: grid; place-items: center; }
    .app .i svg { width: 24px; height: 24px; }
    .app .nm { font-size: 15px; font-weight: 700; }
    .foot { text-align: center; color: var(--sub); font-size: 12px; margin: 22px 0 6px; line-height: 1.7; }
    .setup { margin-top: 14px; }
    .setup .note { font-size: 13px; color: var(--sub); line-height: 1.6; }
    select, input { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); margin-top: 8px; }
    button.go { width: 100%; font-size: 16px; font-weight: 700; padding: 11px; border: 0; border-radius: 12px; background: var(--main); color: #fff; margin-top: 10px; cursor: pointer; }
    .ok { color: #2f7a54; font-weight: 700; } .ng { color: #a8452f; font-weight: 700; }
    /* お知らせ一覧 */
    .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow: auto; display: none; }
    .sheet.on { display: block; }
    .sheet .top { position: sticky; top: 0; background: var(--main); color: #fff; padding: calc(16px + max(env(safe-area-inset-top, 0px), var(--sat, 0px))) 16px 14px; display: flex; align-items: center; gap: 10px; }
    .sheet .top button { border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 15px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
    .sheet .in { max-width: 480px; margin: 0 auto; padding: 14px; }
    .item { padding: 10px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .item .t { font-size: 12px; color: var(--sub); }
    .item .b { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.6; }
    .item.new .t::after { content: "新"; margin-left: 6px; background: var(--or); color: #fff; font-size: 10px; padding: 0 5px; border-radius: 6px; }
    .hide { display: none !important; }
    /* 11/21 大誠さん（iPhone 17 Pro）：スクロールすると中身が時計・電池の帯の下に流れ込む → 帯の高さぶん青を固定で敷き、中身はその下で切れる */
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top, 0px), var(--sat, 0px)); background: #4C88AA; opacity: 1; z-index: 20; }   /* 11/21e 不透明・Dynamic Island の下まで */
    .ntop { padding: 12px 14px; margin-bottom: 12px; border: 1px solid #F3DDBD; background: var(--or-bg); cursor: pointer; }
    .ntop .h { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .ntop .it { font-size: 14px; line-height: 1.55; padding: 4px 0; border-top: 1px dashed #F3DDBD; }
    .ntop .it:first-of-type { border-top: 0; }
    .ntop .t { font-size: 11px; color: var(--sub); margin-right: 6px; }
    .ver { font-size: 10px; color: var(--sub); opacity: .7; }
  </style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <div class="band">
    <div class="row">
      <div class="logo"><img src="logo.png" alt=""></div>
      <img class="wm" src="wordmark.png" alt="ミルキーファーム">
      <button class="bell" onclick="openList()" aria-label="お知らせ">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="n hide" id="unread"></span>
      </button>
    </div>
    <div class="date" id="date"></div>
  </div>

  <main>
    <div class="card hide" id="nokey">
      <b>リンクを1回だけ入れてください</b>
      <div class="setup note">牧場から届いたリンクを長押し →「コピー」→ 下の欄を押して「ペースト」→「開く」。</div>
      <input id="keyin" type="url" inputmode="url" autocomplete="off" placeholder="ここを押して貼る">
      <button class="go" onclick="pasteKey()">開く</button>
    </div>

    <!-- 11/21 大誠さん：お知らせ（今日の分）は一番上。無いときは出さない。ベルの中の7日分の一覧はそのまま -->
    <div class="card ntop hide" id="ntop" onclick="openList()"><div class="h">🔔 今日のお知らせ<span class="c" id="ntopN"></span></div><div id="ntopL"></div></div>

    <div class="card today" id="cowCard">
      <div class="sec"><div class="h">🐄 分娩予定超過<span class="c" id="lateN"></span><span class="duty hide" id="duty"></span></div><div id="late" class="lst">—</div></div>
      <div class="sep"></div>
      <div class="sec"><div class="h">🗓 分娩予定（7日以内）<span class="c" id="soonN"></span></div><div id="soon" class="lst">—</div></div>
      <div class="sep"></div>
      <div class="sec"><div class="h">👯 双子注意<span class="c" id="twinN"></span></div><div id="twin" class="lst">—</div></div>
      <div class="sep"></div>
      <div class="sec"><div class="h">💉 今日のワクチン</div><div id="vac" class="lst">—</div></div>
    </div>

    <!-- 11/21 大誠さん：搾乳頭数・平均乳量・出荷乳量・体細胞を1枚のカードに2×2。前の週の平均より上がった・下がったを矢印で（体細胞は上がったら注意の色）。数字には必ず日付 -->
    <div class="card nums4">
      <div class="num"><div class="k">搾乳頭数</div><div class="v" id="head">—</div><div class="s" id="headS"></div></div>
      <div class="num"><div class="k">平均乳量</div><div class="v" id="avg">—</div><div class="s" id="avgS"></div></div>
      <div class="num"><div class="k">出荷乳量</div><div class="v" id="ship">—</div><div class="s" id="shipS"></div></div>
      <div class="num"><div class="k">体細胞</div><div class="v" id="scc">—</div><div class="s" id="sccS"></div></div>
    </div>


    <div class="card hide" id="photoBox">
        <div class="sec"><div class="h">📷 写真のお願い</div><div id="photo" class="lst"></div><div id="sent" class="lst" style="margin-top:6px"></div>
          <div class="x" style="margin-top:6px;font-size:13px">見開き・前のページが写っていてもOK　<a href="https://milkyfarm.github.io/milkyfarm-note/" style="color:var(--main)">写真取込アプリで送る</a></div></div>

    <!-- 11/21e 大誠さん：アプリの一覧は写真のお願いとは別のカード -->
    <div class="card appsCard"><div class="h2in">アプリ</div><div class="apps" id="apps"></div></div>

    <div class="card setup hide" id="setup">
      <b>通知を受け取る</b>
      <div class="note" id="state"></div>
      <select id="name"></select>
      <input id="name2" class="hide" placeholder="名前を書く" maxlength="20">
      <button class="go" id="allow" onclick="allow()">通知を許可する</button>
    </div>

    <div class="foot" id="foot">iPhoneは「共有」→「ホーム画面に追加」で通知が届きます</div>
  </main>
</div>

<div class="sheet" id="sheet">
  <div class="top"><b style="font-size:17px">お知らせ</b><button style="margin-left:auto" onclick="closeList()">閉じる</button></div>
  <div class="in"><div class="card" id="list">まだありません</div></div>
</div>

<script>
  var VER = '2026-11-21e';   // 11/21 版番号（画面の下に出す。新しい版が出たら自動で読み直す）
  var EXEC = 'https://script.google.com/macros/s/AKfycbweBFqQ_3hq_fmIR12lAtrToWwCSDW2U5SU87Ng6k-H3Xjf1cQrMA93jEJDOObam79j4A/exec';
  var VAPID = 'BF95IondUGeHdtRooS430nvgnnp-59ZUumsC_bg0faFk_p8CDBtLa-19zha3Jn085QqsshbjgHtwPJLEokv57wU';   // 公開鍵（置いてよい）
  // ボタンの最初の形（シート「入口のボタン」が読めたらそちらを使う）
  var APPS0 = [
    { name: '出勤ボード', sub: '今日の出勤と当番', url: 'https://milkyfarm.github.io/milkyfarm-board/', icon: 'board' },
    { name: '写真取込', sub: 'ノート・台帳・書類の写真を送る', url: 'https://milkyfarm.github.io/milkyfarm-note/', icon: 'note' },
    { name: '乳牛カルテ', sub: '牛ごとの病気・乳量', url: 'https://milkyfarm.github.io/milkyfarm-cow/', icon: 'cow' },
    { name: '子牛カルテ', sub: '哺乳と治療の記録', url: 'https://milkyfarm.github.io/milkyfarm-calf/', icon: 'calf' },
    { name: '餌槽カメラ', sub: '餌槽の様子', url: 'https://milkyfarm.github.io/milkyfarm-camera/', icon: 'camera' },
    { name: '肥育成績', sub: '肉牛の出荷成績', url: 'https://milkyfarm.github.io/milkyfarm-hiiku/', icon: 'hiiku' }
  ];
  // 仮のアイコン（白地＋青い線＋オレンジの差し色）
  var B = '#4C88AA', O = '#E9A54E';
  var ICONS = {
    board: '<rect x="5" y="4" width="14" height="17" rx="2" stroke="' + B + '"/><path d="M9 4V3h6v1" stroke="' + B + '"/><circle cx="12" cy="10" r="2.2" stroke="' + O + '"/><path d="M8.5 16.5c.6-2 2-3 3.5-3s2.9 1 3.5 3" stroke="' + B + '"/>',
    note: '<path d="M6 3h9l3 3v15H6z" stroke="' + B + '"/><path d="M9 9h6M9 12.5h6M9 16h3.5" stroke="' + B + '"/><circle cx="16.5" cy="17" r="2.6" fill="#fff" stroke="' + O + '"/>',
    cow: '<path d="M7 7c-2 0-3.5-1-4-2.5M17 7c2 0 3.5-1 4-2.5" stroke="' + B + '"/><path d="M7 6.5h10l-.8 8.5a4.2 4.2 0 0 1-8.4 0z" stroke="' + B + '"/><ellipse cx="12" cy="17.2" rx="3" ry="2" stroke="' + O + '"/><circle cx="9.7" cy="10" r=".6" fill="' + B + '"/><circle cx="14.3" cy="10" r=".6" fill="' + B + '"/>',
    calf: '<path d="M10 3h4v3l1.5 2v12a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V8L10 6z" stroke="' + B + '"/><path d="M8.5 13h7" stroke="' + O + '"/><path d="M11 2h2" stroke="' + B + '"/>',
    camera: '<rect x="3" y="7" width="13" height="9" rx="2" stroke="' + B + '"/><path d="M16 10l5-2.5v8L16 13" stroke="' + B + '"/><circle cx="9.5" cy="11.5" r="2.3" stroke="' + O + '"/>',
    hiiku: '<path d="M4 20h16" stroke="' + B + '"/><path d="M7 17v-5M12 17V8M17 17v-8" stroke="' + B + '"/><path d="M5 9l5-4 4 3 5-4" stroke="' + O + '"/>',
    app: '<rect x="4" y="4" width="16" height="16" rx="4" stroke="' + B + '"/><circle cx="12" cy="12" r="3" stroke="' + O + '"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || ICONS.app) + '</svg>'; }
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }

  // 鍵はページに書かない。リンクの ?k= で受け取り、URLにも残す（iPhone はホーム画面に追加したURLで起動する）
  function pick(s) { var m = String(s || '').match(/[#&?]k=([0-9a-f]{16,})/); return m ? m[1] : (/^[0-9a-f]{16,}$/.test(String(s).trim()) ? String(s).trim() : ''); }
  var key = pick(location.search) || pick(location.hash) || ls('staff_key');
  if (key) { ls('staff_key', key); if (pick(location.search) !== key || location.hash) history.replaceState(null, '', location.pathname + '?k=' + key); }
  function pasteKey() { var k = pick($('keyin').value); if (k) { ls('staff_key', k); location.replace(location.pathname + '?k=' + k); } }

  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  // 11/21 大誠さん（iPhone 17 Pro）：まだ時計の帯にかかる → ホーム画面から開いたときは最低 64px（Dynamic Island の機種の帯の高さ）＋16px 下げる。?sa=1 で試せる
  if ((standalone && isIOS) || /[?&]sa=1/.test(location.search)) document.documentElement.style.setProperty('--sat', '66px');   // 11/21e Dynamic Island の下まで（最低62px＋少し）
  var canPush ='serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  // ---- 日付 ----
  function today() { var d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）'; }
  $('date').textContent = today();

  // ---- ボタン ----
  function drawApps(list) {
    $('apps').innerHTML = list.map(function (a) {
      return '<a class="app" href="' + esc(a.url) + '"><span class="i">' + svg(a.icon) + '</span><span><span class="nm">' + esc(a.name) + '</span></span></a>';
    }).join('');
  }

  // ---- 今日のカード・数字 ----
  var WX = { 0: ['☀️', '晴れ'], 1: ['🌤️', '晴れ'], 2: ['⛅', 'くもり時々晴れ'], 3: ['☁️', 'くもり'], 45: ['🌫️', '霧'], 48: ['🌫️', '霧'], 51: ['🌦️', '霧雨'], 53: ['🌦️', '霧雨'], 55: ['🌦️', '霧雨'], 61: ['🌧️', '雨'], 63: ['🌧️', '雨'], 65: ['🌧️', '強い雨'], 71: ['🌨️', '雪'], 73: ['🌨️', '雪'], 75: ['🌨️', '大雪'], 80: ['🌦️', 'にわか雨'], 81: ['🌧️', 'にわか雨'], 82: ['⛈️', '激しい雨'], 95: ['⛈️', '雷雨'], 96: ['⛈️', '雷雨'], 99: ['⛈️', '雷雨'] };
  function dash(v) { return v === null || v === undefined || v === '' ? '—' : v; }
  function drawHome(d) {
    d = d || {};
    // 当番の表示はやめた（11/20 大誠さん）
    var m = d.milk || {}, pv = m.prev || {};
    // 矢印：前の週の平均より 0.5%以上 上なら↑・下なら↓（体細胞は1つ前の検査と比べ、上がったら注意の色）
    function ar(v, p, bad) { if (v == null || p == null) return ''; var r = (v - p) / p; if (Math.abs(r) < 0.005) return '<span class="ar">→</span>'; var up = r > 0; return '<span class="ar' + (bad && up ? ' warn' : '') + '">' + (up ? '↑' : '↓') + '</span>'; }
    $('head').innerHTML = m.head != null ? esc(m.head) + '<small>頭</small>' + ar(m.head, pv.head) : '—';
    $('avg').innerHTML = m.avg != null ? esc(Number(m.avg).toFixed(1)) + '<small>kg</small>' + ar(m.avg, pv.avg) : '—';
    $('ship').innerHTML = m.ship != null ? esc(Number(m.ship).toLocaleString()) + '<small>kg</small>' + ar(m.ship, pv.ship) : '—';
    var sc = m.scc || {};
    $('scc').innerHTML = sc.v != null ? esc(sc.v) + '<small>万</small>' + ar(sc.v, sc.prev, true) : '—';
    // 11/20 何日の分か分かるように（今日の行が入っていれば今日）。失敗集14：数字には必ずいつの値か
    var nd = new Date(), tmd = (nd.getMonth() + 1) + '/' + nd.getDate();
    $('headS').textContent = $('avgS').textContent = $('shipS').textContent = !m.date ? '' : m.date === tmd ? '今日 ' + m.date : m.date + ' の分';
    $('sccS').textContent = sc.date ? sc.date + ' の検査' : '';
  }

  // 分娩予定超過・双子注意・今日のワクチン（朝の牛の連絡と同じ中身。GAS の staffCow_）
  function drawCow(c) {
    var none = '<span class="none">なし</span>';
    if (!c) { $('late').innerHTML = $('twin').innerHTML = $('vac').innerHTML = '—'; $('lateN').textContent = $('twinN').textContent = ''; return; }
    var L = c.late || [], T = c.twins || [], V = c.vac || [];
    $('lateN').textContent = L.length ? L.length + '頭' : '';
    $('late').innerHTML = L.length ? L.map(function (x) { return '<div class="r"><span class="no">' + esc(x.no) + '</span><span class="bad">' + esc(x.n) + '日すぎ</span>' + (x.sire ? '<span class="x">' + esc(x.sire) + '</span>' : '') + '</div>'; }).join('') : none;
    $('twinN').textContent = T.length ? T.length + '頭' : '';
    $('twin').innerHTML = T.length ? T.map(function (x) { return '<div class="r"><span class="no">' + esc(x.no) + '</span><span class="x">予定 ' + esc(x.due) + '</span><span class="' + (x.n >= 0 ? 'bad' : 'x') + '">' + (x.n > 0 ? x.n + '日すぎ' : x.n === 0 ? '今日' : 'あと' + (-x.n) + '日') + '</span></div>'; }).join('') : none;
    $('vac').innerHTML = V.length ? V.map(function (x) { var m = String(x).match(/^【(.+)】$/); if (m) return '<div class="g">' + esc(m[1]) + '</div>'; var i = String(x).indexOf('　'); return i > 0 ? '<div class="r"><span class="no" style="min-width:5em">' + esc(x.slice(0, i)) + '</span><span>' + esc(x.slice(i + 1)) + '</span></div>' : '<div>' + esc(x) + '</div>'; }).join('') : none;
    // RS生ワクチン（11/20 大誠さん。期間中は一文・期間外は「RS生ワクチン：なし」）
    // 11/20 大誠さん：バイコックス（哺乳ロボ4日目の子牛）が無い日も「なし」と出す
    if (!V.some(function (x) { return /^バイコ/.test(String(x)); })) $('vac').innerHTML += (V.indexOf('【子牛】') < 0 ? '<div class="g">子牛</div>' : '') + '<div class="r"><span class="no" style="min-width:5em">バイコ</span><span class="none">なし</span></div>';
    if (c.rs) $('vac').innerHTML += '<div class="g">RS生ワクチン</div><div>' + esc(String(c.rs).replace(/^RS生ワクチン[：:]?/, '') || 'なし') + '</div>';
    $('vac').innerHTML += '<div class="x" style="margin-top:6px;font-size:13px">※体調不良で延期中の牛・子牛がいないか確認</div>';   // 朝のLINEと同じ一文
    // 写真のお願い（11/20。朝の連絡に載せていたもの。GAS cowMorningSend の parts.photo）
    // 11/21 大誠さん：届いて読み取られたお願いは消える（GAS staffPhotoLive_）。全部消えたらカードごと出さない
    var P = c.photo || [];
    $('photoBox').classList.toggle('hide', !P.length);
    $('photo').innerHTML = P.map(function (x) { return '<div>' + esc(String(x).replace(/^・/, '')) + '</div>'; }).join('');
    $('sent').innerHTML = P.length && c.photoNote ? '<div class="x">' + esc(c.photoNote) + '</div>' : '';
    // 11/21 分娩予定（今日から7日以内・まだ分娩していない。予定日を過ぎた牛は分娩予定超過）
    var S = c.soon || [];
    $('soonN').textContent = S.length ? S.length + '頭' : '';
    $('soon').innerHTML = !c.soon ? '—' : S.length ? S.map(function (x) { return '<div class="r"><span class="no">' + esc(x.no) + '</span><span class="x">予定 ' + esc(x.due) + '</span><span class="x">' + (x.n === 0 ? '今日' : 'あと' + (-x.n) + '日') + '</span></div>'; }).join('') : none;
  }
  var srvNotes = [];   // 社員グループに送った知らせ（GAS staffHome_ の notices）
  // 11/20 大誠さん：届いた写真（直近3日・日と種類ごと）。誰かがもう送ったか分かるように
  function drawSent(S) {
    // 11/20 大誠さん：肉牛書類（精算書・格付表）は大誠さんの書類なので社員のアプリには出さない
    S = (S || []).filter(function (s) { return !/肉牛|精算|格付/.test(String(s.kind)); });
    $('sent').innerHTML = S.length ? '<div class="g">届いた写真</div>' + S.map(function (s) {
      return '<div class="r"><span class="no" style="min-width:5.5em">' + esc(s.day + ' ' + (s.time || '')) + '</span><span>' + esc(s.kind) + ' ' + esc(s.n) + '枚</span><span class="x">' + (s.wait ? '読み取り中' : '読み取り済み') + '</span></div>';
    }).join('') : '';
    if (S.length) $('photoBox').classList.remove('hide');
  }

  async function loadHome() {    try { var c = JSON.parse(ls('staff_home') || 'null'); if (c) { drawHome(c.data); drawCow(c.cow); srvNotes = c.notices || []; drawNotes(); if (c.buttons && c.buttons.length) drawApps(c.buttons); } } catch (e) {}
    if (!key) return;
    try {
      var r = await fetch(EXEC + '?api=staffHome&k=' + encodeURIComponent(key));
      var j = await r.json();
      if (!j.ok) return;
      ls('staff_home', JSON.stringify(j));
      drawHome(j.data); drawCow(j.cow); srvNotes = j.notices || []; drawNotes();
      if (j.buttons && j.buttons.length) drawApps(j.buttons);
    } catch (e) {}
  }

  // ---- お知らせ（service worker が端末の中に残したもの） ----
  function openDb() {
    return new Promise(function (ok, ng) {
      var r = indexedDB.open('mf-staff', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('notes', { keyPath: 'id', autoIncrement: true }); };
      r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ng(r.error); };
    });
  }
  async function notes() {
    try {
      var d = await openDb();
      var all = await new Promise(function (ok) { var q = d.transaction('notes').objectStore('notes').getAll(); q.onsuccess = function () { ok(q.result || []); }; q.onerror = function () { ok([]); }; });
      return all.concat(srvNotes).sort(function (a, b) { return b.at - a.at; });
    } catch (e) { return srvNotes.slice().sort(function (a, b) { return b.at - a.at; }); }
  }
  function when(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  async function drawNotes() {
    var all = await notes(), seen = Number(ls('staff_seen') || 0);
    var un = all.filter(function (n) { return n.at > seen; }).length;
    $('unread').textContent = un > 99 ? '99+' : un; $('unread').classList.toggle('hide', !un);
    // 11/21 大誠さん：今日のお知らせは一番上のカードに（無いときは出さない）
    var t0 = new Date(); t0.setHours(0, 0, 0, 0);
    var td = all.filter(function (n) { return n.at >= t0.getTime(); });
    $('ntop').classList.toggle('hide', !td.length);
    $('ntopN').textContent = td.length ? td.length + '件' : '';
    $('ntopL').innerHTML = td.slice(0, 3).map(function (n) { var d = new Date(n.at); return '<div class="it"><span class="t">' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + '</span>' + esc(String(n.body).split('\n')[0]) + '</div>'; }).join('') + (td.length > 3 ? '<div class="it x">ほか' + (td.length - 3) + '件（押すと全部）</div>' : '');
    if (!all.length) { $('list').textContent = 'まだありません'; return; }
    $('list').innerHTML = '';
    all.slice(0, 100).forEach(function (n) {
      var div = document.createElement('div'); div.className = 'item' + (n.at > seen ? ' new' : '');
      div.innerHTML = '<div class="t"></div><div class="b"></div>';
      div.querySelector('.t').textContent = when(n.at) + (n.title && n.title !== 'ミルキーファーム' ? '　' + n.title : '');
      div.querySelector('.b').textContent = n.body;
      if (n.url && n.url !== './') { div.style.cursor = 'pointer'; div.onclick = function () { location.href = n.url; }; }
      $('list').appendChild(div);
    });
  }
  function openList() { $('sheet').classList.add('on'); drawNotes().then(function () { ls('staff_seen', String(Date.now())); $('unread').classList.add('hide'); }); }
  function closeList() { $('sheet').classList.remove('on'); drawNotes(); }

  // ---- 通知の設定 ----
  function b64ToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function setState(h) { $('state').innerHTML = h; }
  async function loadNames() {
    var sel = $('name'), mine = ls('staff_name');
    try {
      var j = await (await fetch(EXEC + '?api=pushNames&k=' + encodeURIComponent(key))).json();
      if (!j.ok) { setState('<span class="ng">リンクが古いか違います。牧場から届いたリンクで開き直してください。</span>'); return; }
      var names = j.names || [];
      sel.innerHTML = '<option value="">名前を選んでください</option>' + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '<option value="*">その他（書く）</option>';
      if (mine) { if (names.indexOf(mine) >= 0) sel.value = mine; else { sel.value = '*'; $('name2').value = mine; $('name2').classList.remove('hide'); } }
    } catch (e) { setState('<span class="ng">名前の一覧が読めませんでした</span>'); }
  }
  $('name').onchange = function () { $('name2').classList.toggle('hide', this.value !== '*'); };
  async function allow() {
    // 11/20 大誠さん：名前を選ばなくても、アプリを入れた人は全員に送る
    var name = ls('staff_name') || 'アプリ';
    $('allow').disabled = true; setState('設定しています…');
    try {
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('通知が「許可しない」になっています。設定アプリ →「通知」→「ミルキーファーム」で許可してください');
      var reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID) });
      var j = await (await fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'pushReg', k: key, name: name, sub: sub.toJSON(), ua: navigator.userAgent }) })).json();
      if (!j.ok) throw new Error(j.error === 'key' ? 'リンクが古いか違います' : '登録できませんでした');
      ls('staff_name', name); ls('staff_reg', '1');
      setState('<span class="ok">通知の設定ができました。</span>');
      setTimeout(function () { $('setup').classList.add('hide'); }, 2500);
    } catch (e) { setState('<span class="ng">' + esc(e.message || e) + '</span>'); }
    $('allow').disabled = false;
  }

  // ---- はじめ ----
  drawApps(APPS0);
  drawHome(null);
  drawNotes();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'new') drawNotes(); });
  }
  if (standalone) $('foot').textContent = '(有)ミルキーファーム';
  $('foot').innerHTML += '<div class="ver">版 ' + VER + '</div>';
  // 11/21 ホーム画面のアプリが古い版を出し続けないように：開くたび・戻るたびに今の版を見て、違えば読み直す
  async function verCheck() {
    try {
      var t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
      var m = t.match(/var VER = '([^']+)'/);
      if (m && m[1] !== VER && ls('ver_reloaded') !== m[1]) { ls('ver_reloaded', m[1]); location.reload(); }
    } catch (e) {}
  }
  verCheck();
  if (!key) { $('nokey').classList.remove('hide'); }
  else {
    loadHome();
    if (canPush && (!isIOS || standalone) && !(ls('staff_reg') && Notification.permission === 'granted')) {
      $('name').classList.add('hide');
      if (Notification.permission === 'granted') allow();   // もう許可してある端末は黙って登録
      else { $('setup').classList.remove('hide'); setState('「通知を許可する」を押すと、牧場からのお知らせが届きます。'); }
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { $('date').textContent = today(); drawNotes(); if (key) loadHome(); verCheck(); } });
</script>
</body>
</html>
